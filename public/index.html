<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090d18">
  <title>Honkai: Star Rail — เข้าสู่เว็บไซต์</title>
  <style>
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      overflow: hidden;
      background: #090d18;
      color: #fff;
      font-family: Arial, "TH Sarabun New", sans-serif;
    }
    .landing {
      position: relative;
      display: grid;
      min-height: 100vh;
      place-items: center;
      isolation: isolate;
      padding: 24px;
      text-align: center;
    }
    .background-video, .video-overlay {
      position: absolute;
      z-index: -1;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    .background-video { object-fit: cover; }
    .video-overlay {
      background:
        linear-gradient(180deg, rgba(5, 8, 18, .2), rgba(5, 8, 18, .58)),
        radial-gradient(ellipse at center, rgba(5, 8, 18, .12), rgba(5, 8, 18, .68));
    }
    .content { max-width: 720px; }
    .eyebrow {
      margin: 0 0 14px;
      color: #c4b5fd;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .28em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      color: #fff;
      font-size: clamp(38px, 8vw, 76px);
      letter-spacing: .04em;
      text-shadow: 0 3px 24px rgba(0, 0, 0, .55);
    }
    .subtitle {
      margin: 14px 0 34px;
      color: #e2e8f0;
      font-size: clamp(15px, 2vw, 19px);
      text-shadow: 0 2px 12px rgba(0, 0, 0, .7);
    }
    .enter-link {
      display: inline-flex;
      min-width: 190px;
      min-height: 52px;
      align-items: center;
      justify-content: center;
      padding: 12px 26px;
      border: 1px solid rgba(221, 214, 254, .9);
      border-radius: 4px;
      background: rgba(79, 70, 229, .82);
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
      transition: background .2s ease, transform .2s ease;
    }
    .enter-link:hover, .enter-link:focus-visible {
      transform: translateY(-2px);
      background: #6366f1;
      outline: 2px solid #fff;
      outline-offset: 3px;
    }
    .footer {
      position: absolute;
      right: 16px;
      bottom: 16px;
      left: 16px;
      color: rgba(226, 232, 240, .78);
      font-size: 12px;
    }
    @media (prefers-reduced-motion: reduce) {
      .enter-link { transition: none; }
    }
  </style>
</head>
<body>
  <main class="landing">
    <video class="background-video" autoplay muted loop playsinline preload="auto" aria-hidden="true">
      <source src="/star%20rail%20api%20front.mp4" type="video/mp4">
    </video>
    <div class="video-overlay" aria-hidden="true"></div>
    <section class="content" aria-labelledby="page-title">
      <p class="eyebrow">Welcome, Trailblazer</p>
      <h1 id="page-title">HONKAI: STAR RAIL</h1>
      <p class="subtitle">สำรวจข้อมูลตัวละครและจัดทีมของคุณ</p>
      <a class="enter-link" href="/dashboard.html">เข้าสู่เว็บไซต์</a>
    </section>
    <footer class="footer">801201 Week 8 · Honkai: Star Rail Dashboard</footer>
  </main>
</body>
</html>
